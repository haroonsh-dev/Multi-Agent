name: Frontend tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Lint is currently non-blocking: the repo carries ~200 legacy
      # violations (mostly no-explicit-any). Once those are cleared, flip to:
      #   npx eslint src --max-warnings=0
      - name: Lint (report-only)
        run: npx eslint src --report-unused-disable-directives || true
