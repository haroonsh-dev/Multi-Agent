<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="dgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="dgGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="dgBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.4" />
    </linearGradient>
    <filter id="dgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Gem Emblem -->
  <g transform="translate(10, 10)">
    <polygon points="35,5 65,22 65,50 35,67 5,50 5,22" fill="url(#dgBg)" stroke="url(#dgGrad1)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M35,5 L35,67 M5,22 L65,22 M5,50 L65,50 M35,22 L65,50 M35,22 L5,50 M5,22 L35,67 M65,22 L35,67" stroke="url(#dgGrad1)" stroke-width="1.2" stroke-opacity="0.45" />
    <circle cx="35" cy="36" r="7" fill="url(#dgGrad2)" filter="url(#dgGlow)" />
    <circle cx="35" cy="5" r="3" fill="#38bdf8" />
    <circle cx="65" cy="22" r="3" fill="#6366f1" />
    <circle cx="65" cy="50" r="3" fill="#a855f7" />
    <circle cx="35" cy="67" r="3" fill="#34d399" />
    <circle cx="5" cy="50" r="3" fill="#38bdf8" />
    <circle cx="5" cy="22" r="3" fill="#34d399" />
  </g>

  <!-- Brand Typography -->
  <text x="95" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Docu<tspan fill="url(#dgGrad1)">Gemma</tspan>
  </text>
  <rect x="290" y="24" width="36" height="20" rx="5" fill="#6366f1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
  <text x="297" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1">AI</text>
  <text x="96" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2">OPEN-WEIGHT INTELLIGENCE</text>
</svg>
